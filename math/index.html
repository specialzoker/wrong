<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.9/variable/pretendardvariable.min.css" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f5f0;
      --card: #ffffff;
      --primary: #2d5a27;
      --primary-light: #e8f0e6;
      --accent: #c4553a;
      --text: #1a1a1a;
      --text-light: #666;
      --border: #e0ddd5;
      --shadow: 0 2px 12px rgba(0,0,0,0.06);
      --radius: 12px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Pretendard Variable', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    .header {
      background: var(--primary);
      color: white;
      padding: 24px 20px;
      text-align: center;
    }
    .header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
    .header p { font-size: 13px; opacity: 0.8; margin-top: 4px; }
    .back-link {
      display: inline-flex; align-items: center; gap: 4px;
      color: rgba(255,255,255,0.75); font-size: 12px;
      text-decoration: none; margin-bottom: 12px;
    }
    .back-link:hover { color: white; }

    .container { max-width: 640px; margin: 0 auto; padding: 20px 16px 40px; }

    .step-indicator {
      display: flex; gap: 8px; margin-bottom: 24px; justify-content: center;
    }
    .step-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--border); transition: all 0.3s;
    }
    .step-dot.active { background: var(--primary); transform: scale(1.3); }
    .step-dot.done { background: var(--primary); opacity: 0.5; }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      padding: 24px;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 15px; font-weight: 700; margin-bottom: 16px;
      color: var(--primary);
      display: flex; align-items: center; gap: 8px;
    }
    .card-title .num {
      background: var(--primary); color: white;
      width: 24px; height: 24px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; flex-shrink: 0;
    }

    .name-input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid var(--border);
      border-radius: 10px;
      font-size: 16px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 6px;
      color: var(--text);
    }
    .name-input:focus { border-color: var(--primary); }
    .name-hint { font-size: 12px; color: var(--text-light); margin-bottom: 8px; }

    .exam-list { display: flex; flex-direction: column; gap: 8px; }
    .exam-btn {
      padding: 14px 16px;
      border: 2px solid var(--border);
      border-radius: 10px;
      background: white;
      cursor: pointer;
      text-align: left;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.2s;
      display: flex; justify-content: space-between; align-items: center;
    }
    .exam-btn:hover { border-color: var(--primary); background: var(--primary-light); }
    .exam-btn.selected { border-color: var(--primary); background: var(--primary-light); font-weight: 600; }
    .exam-btn .date { font-size: 12px; color: var(--text-light); }

    .q-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }
    .q-check {
      aspect-ratio: 1;
      border: 2px solid var(--border);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      user-select: none;
      background: white;
    }
    .q-check:hover { border-color: var(--accent); }
    .q-check.wrong {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
      transform: scale(0.95);
    }

    .section-label {
      font-size: 12px; font-weight: 600;
      color: var(--text-light);
      margin: 16px 0 8px;
      padding: 4px 10px;
      background: #f0f0ea;
      border-radius: 6px;
      display: inline-block;
    }

    .subject-tabs {
      display: flex; gap: 6px; margin-bottom: 12px;
    }
    .subject-tab {
      flex: 1; padding: 10px;
      border: 2px solid var(--border);
      border-radius: 8px;
      background: white;
      cursor: pointer;
      text-align: center;
      font-size: 13px;
      font-family: inherit;
      font-weight: 500;
      transition: all 0.2s;
    }
    .subject-tab:hover { border-color: var(--primary); }
    .subject-tab.active { border-color: var(--primary); background: var(--primary); color: white; }

    .btn {
      width: 100%; padding: 16px;
      border: none; border-radius: 10px;
      font-size: 16px; font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 16px;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .btn-outline {
      background: white; color: var(--primary);
      border: 2px solid var(--primary);
    }
    .btn-outline:hover { background: var(--primary-light); }

    .result-group { margin-bottom: 28px; }
    .result-header {
      background: var(--primary-light);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }
    .result-header .wrong-info { font-size: 14px; font-weight: 700; color: var(--primary); }
    .result-header .wrong-detail { font-size: 12px; color: var(--text-light); margin-top: 2px; }

    .rec-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 8px;
      overflow: hidden;
      background: white;
    }
    .rec-top {
      padding: 12px 16px;
      display: flex; justify-content: space-between; align-items: center;
      cursor: pointer;
      transition: background 0.2s;
    }
    .rec-top:hover { background: #fafaf7; }
    .rec-title { font-size: 14px; font-weight: 600; }
    .rec-meta { font-size: 12px; color: var(--text-light); }
    .rec-badge { font-size: 11px; padding: 3px 8px; border-radius: 6px; font-weight: 600; }
    .badge-하 { background: #e8f5e9; color: #2e7d32; }
    .badge-중 { background: #fff3e0; color: #e65100; }
    .badge-상 { background: #fce4ec; color: #c62828; }

    .rec-expand { display: none; border-top: 1px solid var(--border); }
    .rec-expand.open { display: block; }

    .pdf-frame { width: 100%; height: 500px; border: none; background: #eee; }

    .answer-toggle { padding: 12px 16px; text-align: center; }
    .btn-answer {
      padding: 10px 20px;
      border: 2px solid var(--accent);
      border-radius: 8px;
      background: white;
      color: var(--accent);
      font-size: 13px; font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-answer:hover { background: var(--accent); color: white; }

    .answer-area {
      display: none; padding: 12px 16px;
      background: #fff8f6;
      border-top: 1px solid var(--border);
      text-align: center;
    }
    .answer-area.open { display: block; }
    .answer-value { font-size: 28px; font-weight: 800; color: var(--accent); margin: 8px 0; }
    .answer-label { font-size: 12px; color: var(--text-light); }

    .loading { text-align: center; padding: 40px; color: var(--text-light); font-size: 14px; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .count-badge {
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--accent); color: white;
      min-width: 22px; height: 22px; padding: 0 6px;
      border-radius: 11px;
      font-size: 12px; font-weight: 700;
      margin-left: 8px;
    }

    .hidden { display: none; }
    .empty-msg { text-align: center; padding: 30px; color: var(--text-light); font-size: 14px; }

    .page-hint {
      padding: 8px 16px;
      background: #f9f9f5;
      font-size: 13px; color: var(--text-light);
      text-align: center;
      border-bottom: 1px solid var(--border);
    }
    .page-hint strong { color: var(--primary); }
  </style>
</head>
<body>

<div class="header">
  <a class="back-link" href="../">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    과목 선택으로
  </a>
  <h1>📐 오답문제 해결하여 수능 만점 받기(수학편)<br>
  <span style="font-size:14px;font-weight:400;opacity:0.85;">만든사람 : 경기진협 자료개발국 간사, 광명북고 진로진학부장 정현석</span></h1>
  <p id="headerSub">틀린 문제를 체크하면 유사 유형을 추천해줍니다. 제발 다시는 틀리지 마시라.</p>
</div>

<div class="container">
  <div class="step-indicator">
    <div class="step-dot active" id="dot0"></div>
    <div class="step-dot" id="dot1"></div>
    <div class="step-dot" id="dot2"></div>
    <div class="step-dot" id="dot3"></div>
  </div>

  <!-- STEP 0: 이름 입력 -->
  <div id="step0">
    <div class="card">
      <div class="card-title"><span class="num">1</span> 이름을 입력하세요</div>
      <input type="text" id="studentNameInput" class="name-input" placeholder="예: 홍길동"
        oninput="updateNameBtn()" onkeydown="if(event.key==='Enter') submitName()">
      <div class="name-hint">오답 기록이 브라우저에 저장됩니다</div>
      <button class="btn btn-primary" id="nameNextBtn" disabled onclick="submitName()">다음 →</button>
    </div>
  </div>

  <!-- STEP 1: 시험 선택 -->
  <div id="step1" class="hidden">
    <div class="card">
      <div class="card-title"><span class="num">2</span> 본인이 응시한 모의고사를 선택하세요</div>
      <div class="exam-list" id="examList">
        <div class="loading"><div class="spinner"></div>시험 목록을 불러오는 중...</div>
      </div>
    </div>
    <button class="btn btn-outline" onclick="goBack(0)">← 이름 다시 입력</button>
  </div>

  <!-- STEP 2: 오답 체크 -->
  <div id="step2" class="hidden">
    <div class="card">
      <div class="card-title">
        <span class="num">3</span>
        틀린 문항을 선택하세요
        <span class="count-badge hidden" id="wrongCount">0</span>
      </div>

      <div class="section-label">공통 (1~22번)</div>
      <div class="q-grid" id="commonGrid"></div>

      <div style="margin-top: 20px;">
        <div class="section-label">선택과목</div>
        <div class="subject-tabs" id="subjectTabs">
          <button class="subject-tab active" onclick="selectSubject('확통', event)">확률과 통계</button>
          <button class="subject-tab" onclick="selectSubject('미적분', event)">미적분</button>
          <button class="subject-tab" onclick="selectSubject('기하', event)">기하</button>
        </div>
        <div class="q-grid" id="selectGrid"></div>
      </div>

      <button class="btn btn-primary" id="submitBtn" disabled onclick="submitWrong()">추천 문제 받기</button>
      <button class="btn btn-outline" onclick="goBack(1)">← 시험 다시 선택</button>
    </div>
  </div>

  <!-- STEP 3: 결과 -->
  <div id="step3" class="hidden">
    <div id="resultArea"></div>
    <button class="btn btn-outline" onclick="goBack(2)" style="margin-top:8px">← 다른 문제 체크하기</button>
    <button class="btn btn-outline" onclick="goBack(1)">← 시험 다시 선택</button>
  </div>

  <!-- 로딩 -->
  <div id="loadingOverlay" class="hidden">
    <div class="card">
      <div class="loading"><div class="spinner"></div>데이터를 불러오는 중...</div>
    </div>
  </div>
</div>

<script>
  var state = {
    studentName: '',
    exams: [],
    selectedExam: null,
    selectedSubject: '확통',
    wrongNumbers: [],
    questions: [],
    allData: null
  };

  window.onload = function() {
    document.getElementById('studentNameInput').focus();
    showStep('loading');

    // 어드민 localStorage 우선 (로컬 실행 시)
    var localData = null;
    try { localData = JSON.parse(localStorage.getItem('ad_math') || ''); } catch(e) {}
    if (localData && localData.exams && localData.exams.length) {
      state.allData = localData;
      state.exams = localData.exams;
      showStep(0);
      return;
    }

    var urls = [
      '../data/math.json',
      'https://raw.githubusercontent.com/specialzoker/wrong/main/data/math.json?t=' + Date.now()
    ];
    (function tryNext(i) {
      if (i >= urls.length) {
        document.getElementById('loadingOverlay').innerHTML =
          '<div class="card"><div class="empty-msg">데이터를 불러오지 못했습니다.<br><small style="color:#aaa">어드민 페이지에서 먼저 데이터를 입력하세요</small></div></div>';
        return;
      }
      fetch(urls[i])
        .then(function(r) { if (!r.ok) throw new Error(); return r.json(); })
        .then(function(data) { state.allData = data; state.exams = data.exams || []; showStep(0); })
        .catch(function() { tryNext(i + 1); });
    })(0);
  };

  function updateNameBtn() {
    var val = document.getElementById('studentNameInput').value.trim();
    document.getElementById('nameNextBtn').disabled = val.length === 0;
  }

  function submitName() {
    var val = document.getElementById('studentNameInput').value.trim();
    if (!val) return;
    state.studentName = val;
    document.getElementById('headerSub').textContent = val + ' 학생의 오답 유사문제를 추천해 드려요';
    showStep(1);
    renderExamList();
  }

  function renderExamList() {
    if (!state.exams || state.exams.length === 0) {
      document.getElementById('examList').innerHTML =
        '<div class="empty-msg">시험 목록이 없습니다.<br><small>data/math.json 파일을 확인해주세요.</small></div>';
      return;
    }
    var html = '';
    state.exams.forEach(function(exam) {
      var hasData = (exam.question_pdf_id && exam.question_pdf_id !== '' && exam.question_pdf_id.indexOf('여기에입력') < 0) || (exam.question_pdf_path && exam.question_pdf_path.length > 3);
      var safeId = String(exam.exam_id).replace(/'/g, "\\'");
      html += '<button class="exam-btn" onclick="selectExam(\'' + safeId + '\', this)">'
        + '<span>' + exam.exam_name + '</span>'
        + '<span class="date">' + (hasData ? '✓ PDF 연결됨' : 'PDF 미등록') + '</span>'
        + '</button>';
    });
    document.getElementById('examList').innerHTML = html;
  }

  function selectExam(examId, btnEl) {
    state.selectedExam = null;
    for (var i = 0; i < state.exams.length; i++) {
      if (String(state.exams[i].exam_id) === String(examId)) {
        state.selectedExam = state.exams[i];
        break;
      }
    }
    if (!state.selectedExam) { alert('시험 정보를 찾을 수 없습니다.'); return; }

    document.querySelectorAll('.exam-btn').forEach(function(b) { b.classList.remove('selected'); });
    btnEl.classList.add('selected');

    state.wrongNumbers = [];
    state.questions = state.allData.questions.filter(function(q) {
      return String(q.exam_id) === String(examId);
    });

    renderStep2();
    showStep(2);
  }

  function renderStep2() {
    var commonHtml = '';
    for (var i = 1; i <= 22; i++) {
      commonHtml += '<div class="q-check" data-no="' + i + '" onclick="toggleWrong(this, ' + i + ')">' + i + '</div>';
    }
    document.getElementById('commonGrid').innerHTML = commonHtml;

    var tabs = document.querySelectorAll('.subject-tab');
    tabs.forEach(function(t) { t.classList.remove('active'); });
    tabs[0].classList.add('active');
    state.selectedSubject = '확통';

    renderSelectGrid();
    updateSubmitBtn();
  }

  function selectSubject(sub, event) {
    state.selectedSubject = sub;
    state.wrongNumbers = state.wrongNumbers.filter(function(n) { return n < 23; });
    document.querySelectorAll('.subject-tab').forEach(function(t) { t.classList.remove('active'); });
    event.target.classList.add('active');
    renderSelectGrid();
    updateSubmitBtn();
  }

  function renderSelectGrid() {
    var html = '';
    for (var i = 23; i <= 30; i++) {
      var isWrong = state.wrongNumbers.indexOf(i) >= 0;
      html += '<div class="q-check' + (isWrong ? ' wrong' : '') + '" data-no="' + i + '" onclick="toggleWrong(this, ' + i + ')">' + i + '</div>';
    }
    document.getElementById('selectGrid').innerHTML = html;
  }

  function toggleWrong(el, no) {
    var idx = state.wrongNumbers.indexOf(no);
    if (idx >= 0) {
      state.wrongNumbers.splice(idx, 1);
      el.classList.remove('wrong');
    } else {
      state.wrongNumbers.push(no);
      el.classList.add('wrong');
    }
    updateSubmitBtn();
  }

  function updateSubmitBtn() {
    var count = state.wrongNumbers.length;
    var btn = document.getElementById('submitBtn');
    var badge = document.getElementById('wrongCount');
    btn.disabled = count === 0;
    btn.textContent = count > 0 ? count + '개 문항 추천 받기' : '틀린 문항을 선택하세요';
    if (count > 0) { badge.classList.remove('hidden'); badge.textContent = count; }
    else { badge.classList.add('hidden'); }
  }

  function submitWrong() {
    var result = getRecommendationsLocal(
      state.selectedExam.exam_id,
      state.wrongNumbers,
      state.selectedSubject,
      state.studentName
    );
    renderResults(result);
    showStep(3);
  }

  function getRecommendationsLocal(examId, wrongNumbers, selectedSubject, studentName) {
    var allQuestions = state.allData.questions;
    var selectedIsCommon = '선택-' + selectedSubject;

    var wrongQuestions = allQuestions.filter(function(q) {
      if (q.exam_id !== examId) return false;
      if (wrongNumbers.indexOf(q.question_no) < 0) return false;
      if (q.is_common !== '공통' && q.is_common !== selectedIsCommon) return false;
      return true;
    });

    var recommendations = [];
    wrongQuestions.forEach(function(wrongQ) {
      var similar = allQuestions.filter(function(q) {
        if (q.exam_id === examId) return false;
        if (q.topic !== wrongQ.topic || q.subtopic !== wrongQ.subtopic) return false;
        if (wrongQ.is_common === '공통') return q.is_common === '공통';
        else return q.is_common === wrongQ.is_common;
      });

      if (similar.length < 5) {
        var topicMatch = allQuestions.filter(function(q) {
          if (q.exam_id === examId) return false;
          if (q.topic !== wrongQ.topic) return false;
          var isDup = similar.some(function(s) {
            return s.exam_id === q.exam_id && s.question_no === q.question_no;
          });
          if (isDup) return false;
          if (wrongQ.is_common === '공통') return q.is_common === '공통';
          else return q.is_common === wrongQ.is_common;
        });
        similar = similar.concat(topicMatch);
      }

      // 난이도 내림차순 정렬(상>중>하) 후 상위 30개 → 초과분(쉬운 것)은 자동 제거
      var DIFF_RANK = { '상': 3, '중': 2, '하': 1 };
      similar.sort(function(a, b) {
        return (DIFF_RANK[b.difficulty] || 0) - (DIFF_RANK[a.difficulty] || 0);
      });
      similar = similar.slice(0, 30);
      recommendations.push({ wrongQuestion: wrongQ, similarQuestions: similar });
    });

    var examPdfMap = {};
    state.allData.exams.forEach(function(exam) {
      examPdfMap[String(exam.exam_id)] = {
        exam_name: exam.exam_name,
        question_pdf_id:   exam.question_pdf_id   || '',
        answer_pdf_id:     exam.answer_pdf_id     || '',
        question_pdf_path: exam.question_pdf_path || '',
        answer_pdf_path:   exam.answer_pdf_path   || ''
      };
    });

    saveWrongRecordLocal(examId, wrongNumbers, studentName);
    return { recommendations: recommendations, examPdfMap: examPdfMap };
  }

  function saveWrongRecordLocal(examId, wrongNumbers, studentName) {
    try {
      var records = JSON.parse(localStorage.getItem('wrongRecords_math') || '[]');
      records.push({
        date: new Date().toISOString(),
        studentName: studentName || 'web_user',
        examId: examId,
        wrongNumbers: wrongNumbers.join(',')
      });
      localStorage.setItem('wrongRecords_math', JSON.stringify(records));
    } catch(e) {}
  }

  function renderResults(result) {
    var recs = result.recommendations;
    var pdfMap = result.examPdfMap;
    var html = '<div class="card"><div class="card-title"><span class="num">4</span> 추천 문제</div>';

    if (!recs || recs.length === 0) {
      html += '<div class="empty-msg">추천할 문제가 없습니다.<br><small>data/math.json에 데이터가 있는지 확인해주세요.</small></div></div>';
      document.getElementById('resultArea').innerHTML = html;
      return;
    }
    html += '</div>';

    recs.forEach(function(rec, rIdx) {
      var wq = rec.wrongQuestion;
      html += '<div class="result-group">';
      html += '<div class="result-header">';
      html += '<div class="wrong-info">❌ ' + wq.question_no + '번 오답</div>';
      html += '<div class="wrong-detail">' + wq.topic + ' > ' + wq.subtopic + ' | 난이도: ' + wq.difficulty + ' | 배점: ' + wq.score + '점</div>';
      html += '</div>';

      if (rec.similarQuestions.length === 0) {
        html += '<div class="empty-msg">이 유형의 유사 문제가 아직 등록되지 않았어요.</div>';
      }

      rec.similarQuestions.forEach(function(sq, sIdx) {
        var examInfo = pdfMap[sq.exam_id] || {};
        var examName = examInfo.exam_name || sq.exam_id;
        var pdfId    = examInfo.question_pdf_id   || '';
        var ansPdfId = examInfo.answer_pdf_id     || '';
        var pdfPath  = examInfo.question_pdf_path || '';
        var ansPdfPath = examInfo.answer_pdf_path || '';
        var cardId = 'rec_' + rIdx + '_' + sIdx;

        html += '<div class="rec-card">';
        html += '<div class="rec-top" onclick="toggleExpand(\'' + cardId + '\')">';
        html += '<div><div class="rec-title">' + examName + ' ' + sq.question_no + '번</div>';
        html += '<div class="rec-meta">' + sq.topic + ' > ' + sq.subtopic + '</div></div>';
        html += '<span class="rec-badge badge-' + sq.difficulty + '">' + sq.difficulty + '</span>';
        html += '</div>';

        html += '<div class="rec-expand" id="' + cardId + '">';
        if (pdfPath) {
          html += '<div class="page-hint">📄 PDF <strong>' + sq.question_page + '페이지</strong>의 <strong>' + sq.question_no + '번</strong> 문제를 풀어보세요</div>';
          html += '<div class="doc-slot" data-src="../' + pdfPath + '" data-page="' + sq.question_page + '" data-height="500"></div>';
        } else if (pdfId) {
          html += '<div class="page-hint">📄 PDF <strong>' + sq.question_page + '페이지</strong>의 <strong>' + sq.question_no + '번</strong> 문제를 풀어보세요</div>';
          html += '<iframe class="pdf-frame" src="https://drive.google.com/file/d/' + pdfId + '/preview?rm=minimal#page=' + sq.question_page + '" loading="lazy"></iframe>';
        } else {
          html += '<div class="empty-msg">PDF가 아직 등록되지 않았어요.</div>';
        }

        html += '<div class="answer-toggle">';
        html += '<button class="btn-answer" onclick="toggleAnswer(\'' + cardId + '_ans\')">정답 보기</button>';
        html += '</div>';

        html += '<div class="answer-area" id="' + cardId + '_ans">';
        html += '<div class="answer-label">정답</div>';
        html += '<div class="answer-value">' + sq.correct_answer + '</div>';
        if (ansPdfPath) {
          html += '<div class="page-hint" style="margin:8px -16px -12px;border-radius:0">📄 정답 <strong>' + sq.answer_page + '페이지</strong></div>';
          html += '<div class="doc-slot" data-src="../' + ansPdfPath + '" data-page="' + sq.answer_page + '" data-height="300"></div>';
        } else if (ansPdfId) {
          html += '<div class="page-hint" style="margin:8px -16px -12px;border-radius:0">📄 정답 PDF <strong>' + sq.answer_page + '페이지</strong></div>';
          html += '<iframe class="pdf-frame" style="height:300px" src="https://drive.google.com/file/d/' + ansPdfId + '/preview?rm=minimal#page=' + sq.answer_page + '" loading="lazy"></iframe>';
        }
        html += '</div>';
        html += '</div>';
        html += '</div>';
      });
      html += '</div>';
    });

    document.getElementById('resultArea').innerHTML = html;
    hydrateDocSlots();
  }

  // 로컬 문서 슬롯: 파일 실제 형식을 감지해 PDF면 iframe, 이미지면 img로 렌더
  var _docTypeCache = {};
  function hydrateDocSlots() {
    var slots = document.querySelectorAll('.doc-slot');
    slots.forEach(function(slot) {
      if (slot.getAttribute('data-done')) return;
      var src    = slot.getAttribute('data-src');
      var page   = slot.getAttribute('data-page') || '1';
      var height = slot.getAttribute('data-height') || '500';

      function inject(type) {
        slot.setAttribute('data-done', '1');
        if (type === 'img') {
          slot.innerHTML = '<img src="' + src + '" style="width:100%;display:block" loading="lazy">';
        } else {
          slot.innerHTML = '<iframe class="pdf-frame" style="height:' + height + 'px" src="' + src + '#page=' + page + '&toolbar=0&navpanes=0&view=FitH" loading="lazy"></iframe>';
        }
      }

      if (_docTypeCache[src]) { inject(_docTypeCache[src]); return; }

      fetch(src, { headers: { 'Range': 'bytes=0-7' } })
        .then(function(r) { return r.blob(); })
        .then(function(blob) { return blob.slice(0, 8).arrayBuffer(); })
        .then(function(buf) {
          var b = new Uint8Array(buf);
          var isPdf = b[0] === 0x25 && b[1] === 0x50 && b[2] === 0x44 && b[3] === 0x46;
          var type = isPdf ? 'pdf' : 'img';
          _docTypeCache[src] = type;
          inject(type);
        })
        .catch(function() { inject('pdf'); });
    });
  }

  function showStep(n) {
    ['step0', 'step1', 'step2', 'step3', 'loadingOverlay'].forEach(function(id) {
      document.getElementById(id).classList.add('hidden');
    });
    if (n === 'loading') {
      document.getElementById('loadingOverlay').classList.remove('hidden');
      return;
    }
    document.getElementById('step' + n).classList.remove('hidden');
    ['dot0', 'dot1', 'dot2', 'dot3'].forEach(function(id, i) {
      var dot = document.getElementById(id);
      dot.className = 'step-dot';
      if (i === n) dot.classList.add('active');
      if (i < n) dot.classList.add('done');
    });
    window.scrollTo(0, 0);
  }

  function goBack(step) {
    if (step <= 1) { state.wrongNumbers = []; state.selectedExam = null; }
    showStep(step);
  }

  function toggleExpand(id) { document.getElementById(id).classList.toggle('open'); }
  function toggleAnswer(id) { document.getElementById(id).classList.toggle('open'); }
</script>
